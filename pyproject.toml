[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metaheuristics"
version = "0.1.0"
description = "GA, PSO, GWO and WOA implemented from scratch with NumPy, with binary versions for feature selection."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
